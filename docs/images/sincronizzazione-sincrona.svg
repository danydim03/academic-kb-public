<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="1120" fill="#ffffff"/>

  <!-- ============ HEADER ============ -->
  <text x="60" y="54" font-size="30" font-weight="700" fill="#111827">La comunicazione sincrona</text>
  <text x="60" y="84" font-size="16" fill="#6b7280">Il sender resta bloccato fino al completamento dell'operazione · DS_Communication-RPC.pdf, pp. 4–7</text>
  <line x1="60" y1="100" x2="1340" y2="100" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ============ SEZIONE A ============ -->
  <text x="60" y="132" font-size="15" font-weight="700" fill="#2563eb">A · Diagramma di sequenza — RPC sincrona (variante f: response-based)</text>

  <!-- lifelines -->
  <line x1="310" y1="196" x2="310" y2="560" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="990" y1="196" x2="990" y2="560" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- participant boxes -->
  <rect x="200" y="150" width="220" height="46" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="310" y="171" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Client</text>
  <text x="310" y="188" font-size="12" fill="#3b82f6" text-anchor="middle">chiamante (sender)</text>

  <rect x="880" y="150" width="220" height="46" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="990" y="171" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Server</text>
  <text x="990" y="188" font-size="12" fill="#3b82f6" text-anchor="middle">chiamato (receiver)</text>

  <!-- blocked bar -->
  <rect x="290" y="250" width="36" height="280" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="252" y="392" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" transform="rotate(-90 252 392)">SENDER BLOCCATO</text>

  <!-- request -->
  <line x1="330" y1="250" x2="972" y2="250" stroke="#2563eb" stroke-width="2"/>
  <polygon points="972,250 958,244 958,256" fill="#2563eb"/>
  <text x="650" y="241" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">request — invocazione della procedura remota</text>

  <!-- receipt tick -->
  <line x1="982" y1="294" x2="998" y2="294" stroke="#0891b2" stroke-width="3"/>
  <!-- delivery tick -->
  <line x1="982" y1="316" x2="998" y2="316" stroke="#0891b2" stroke-width="3"/>

  <!-- processing box -->
  <rect x="958" y="340" width="64" height="122" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="990" y="404" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle" transform="rotate(-90 990 404)">esecuzione procedura</text>

  <!-- reply -->
  <line x1="972" y1="490" x2="348" y2="490" stroke="#059669" stroke-width="2"/>
  <polygon points="348,490 362,484 362,496" fill="#059669"/>
  <text x="650" y="481" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">reply — risultato restituito</text>

  <!-- unblock tick -->
  <line x1="298" y1="530" x2="322" y2="530" stroke="#059669" stroke-width="3"/>
  <text x="336" y="535" font-size="12.5" fill="#047857">sender riprende l'esecuzione</text>

  <!-- checkpoint connectors -->
  <line x1="1000" y1="250" x2="1120" y2="250" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1128" y="245" font-size="13" font-weight="700" fill="#111827">① alla sottomissione</text>
  <text x="1128" y="261" font-size="11.5" fill="#6b7280">il sender comincia ad attendere</text>

  <line x1="1000" y1="294" x2="1120" y2="294" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1128" y="289" font-size="13" font-weight="700" fill="#111827">② alla consegna</text>
  <text x="1128" y="305" font-size="11.5" fill="#6b7280">receipt = buffer · poi delivery all'applicazione</text>

  <line x1="1000" y1="490" x2="1120" y2="490" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1128" y="485" font-size="13" font-weight="700" fill="#111827">③ dopo l'elaborazione</text>
  <text x="1128" y="501" font-size="11.5" fill="#6b7280">response = il mittente si sblocca</text>

  <!-- ============ SEZIONE B ============ -->
  <line x1="60" y1="592" x2="1340" y2="592" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="624" font-size="15" font-weight="700" fill="#2563eb">B · Le sei combinazioni: sincronizzazione × persistenza (assi indipendenti)</text>

  <!-- header row -->
  <rect x="60" y="646" width="1280" height="44" fill="#f9fafb"/>
  <text x="72" y="666" font-size="12.5" font-weight="700" fill="#374151">Persistenza ↓</text>
  <text x="72" y="682" font-size="11" fill="#9ca3af">× Sincronizzazione →</text>
  <text x="372" y="673" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Asincrona</text>
  <text x="692" y="673" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Sincrona · receipt</text>
  <text x="1012" y="673" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Sincrona · delivery</text>
  <text x="1252" y="673" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Sincrona · response</text>

  <!-- row labels -->
  <rect x="60" y="690" width="1280" height="128" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="60" y="818" width="1280" height="128" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="72" y="746" font-size="13.5" font-weight="700" fill="#1f2937">PERSISTENTE</text>
  <text x="72" y="765" font-size="11.5" fill="#6b7280">il middleware memorizza</text>
  <text x="72" y="873" font-size="13.5" font-weight="700" fill="#1f2937">TRANSIENTE</text>
  <text x="72" y="892" font-size="11.5" fill="#6b7280">nessuna memorizzazione</text>

  <!-- vertical separators -->
  <line x1="230" y1="646" x2="230" y2="946" stroke="#e5e7eb"/>
  <line x1="530" y1="646" x2="530" y2="946" stroke="#e5e7eb"/>
  <line x1="850" y1="646" x2="850" y2="946" stroke="#e5e7eb"/>
  <line x1="1170" y1="646" x2="1170" y2="946" stroke="#e5e7eb"/>
  <line x1="60" y1="818" x2="1340" y2="818" stroke="#e5e7eb"/>

  <!-- a -->
  <text x="246" y="716" font-size="14" font-weight="700" fill="#7c3aed">a)</text>
  <text x="268" y="716" font-size="13" fill="#4b5563">email, Teams chat, MOM</text>
  <text x="246" y="742" font-size="12" fill="#6b7280">il sender non attende;</text>
  <text x="246" y="760" font-size="12" fill="#6b7280">memorizzato finché il</text>
  <text x="246" y="778" font-size="12" fill="#6b7280">receiver è pronto</text>

  <!-- b -->
  <text x="566" y="716" font-size="14" font-weight="700" fill="#7c3aed">b)</text>
  <text x="588" y="716" font-size="13" fill="#4b5563">bloccato fino alla consegna</text>
  <text x="566" y="742" font-size="12" fill="#6b7280">il messaggio è memorizzato</text>
  <text x="566" y="760" font-size="12" fill="#6b7280">fino alla conferma</text>
  <text x="566" y="778" font-size="12" fill="#6b7280">di consegna</text>

  <!-- c -->
  <text x="246" y="855" font-size="14" font-weight="700" fill="#7c3aed">c)</text>
  <text x="268" y="855" font-size="13" fill="#4b5563">UDP</text>
  <text x="246" y="881" font-size="12" fill="#6b7280">il sender non attende;</text>
  <text x="246" y="899" font-size="12" fill="#6b7280">se il receiver è offline</text>
  <text x="246" y="917" font-size="12" fill="#6b7280">il messaggio si perde</text>

  <!-- d -->
  <text x="566" y="855" font-size="14" font-weight="700" fill="#7c3aed">d)</text>
  <text x="588" y="855" font-size="13" fill="#4b5563">RPC asincrona</text>
  <text x="566" y="881" font-size="12" fill="#6b7280">bloccato finché il messaggio</text>
  <text x="566" y="899" font-size="12" fill="#6b7280">raggiunge il buffer</text>
  <text x="566" y="917" font-size="12" fill="#6b7280">del receiver</text>

  <!-- e -->
  <text x="886" y="855" font-size="14" font-weight="700" fill="#7c3aed">e)</text>
  <text x="908" y="855" font-size="13" fill="#4b5563">delivery-based</text>
  <text x="886" y="881" font-size="12" fill="#6b7280">bloccato finché il messaggio</text>
  <text x="886" y="899" font-size="12" fill="#6b7280">è effettivamente</text>
  <text x="886" y="917" font-size="12" fill="#6b7280">consegnato al receiver</text>

  <!-- f highlighted -->
  <rect x="1176" y="826" width="158" height="112" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1200" y="855" font-size="14" font-weight="700" fill="#1d4ed8">f)</text>
  <text x="1222" y="855" font-size="13" font-weight="700" fill="#1d4ed8">RPC sincrona</text>
  <text x="1188" y="881" font-size="12" fill="#1e40af">bloccato finché</text>
  <text x="1188" y="899" font-size="12" fill="#1e40af">arriva la reply</text>
  <text x="1188" y="917" font-size="12" font-weight="700" fill="#1d4ed8">← il nostro caso</text>

  <!-- ============ NOTE ============ -->
  <line x1="60" y1="972" x2="1340" y2="972" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="996" font-size="12.5" font-weight="700" fill="#111827">Da ricordare</text>
  <text x="60" y="1018" font-size="12.5" fill="#4b5563">• Sincronizzazione e persistenza sono assi indipendenti: RPC nasce sincrona, ma esistono framework con varianti asincrone (p. 3, p. 25).</text>
  <text x="60" y="1040" font-size="12.5" fill="#4b5563">• Costo del sincrono: RPC su LAN è ~10⁵ volte più lenta di una chiamata locale su WAN ~10⁶ (overhead: context switching, copia dati, comunicazione) (p. 26).</text>
  <text x="60" y="1062" font-size="12.5" fill="#4b5563">• Il blocco rende indistinguibile lentezza e guasto: servono timeout e semantiche esplicite at-least-once / at-most-once (pp. 8, 24).</text>
  <text x="60" y="1092" font-size="11.5" fill="#9ca3af">Fonti: DS_Communication-RPC.pdf (pp. 3–8, 24–26) · SDCC 10 - 27-oct-23.pdf (pp. 1, 3, 6)</text>
</svg>
