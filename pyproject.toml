[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-kb"
version = "0.1.0"
description = "Personal Academic Knowledge Engine for University Study & Pi Coding Agent via MCP"
authors = [{ name = "Daniele Di Meo" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.23.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "core",
    "connectors",
    "engine",
    "scripts",
    "mcp_server"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
